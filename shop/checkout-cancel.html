<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Cancelled — Hypodermical Benelux</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Bodoni+Moda:ital,wght@0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="stylesheet" href="/assets/css/header.css" />
  <link rel="stylesheet" href="/assets/css/bubbles.css" />
  <link rel="stylesheet" href="/shop/assets/css/shop.css" />
</head>
<body class="has-header-offset">

  <header class="site-header" id="site-header">
    <div class="header-inner container">
      <a href="/" class="logo">
        <img src="/assets/images/hypodermical-bubbles-animated.svg" alt="" class="logo-mark" width="28" height="24" />
        <span class="logo-text">hypodermical<span class="logo-dot">.</span></span>
      </a>
      <nav class="header-nav" aria-label="Primary">
        <a href="/pages/method.html" class="nav-link">The Method</a>
        <a href="/pages/treatments.html" class="nav-link">Treatments</a>
        <a href="/pages/professionals.html" class="nav-link">Professionals</a>
        <a href="/shop/" class="nav-link">Shop</a>
      </nav>
      <div class="header-actions">
        <a href="/shop/cart.html" class="header-cart-btn" aria-label="Shopping cart">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
          <span class="cart-badge" style="display:none">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="checkout-result">
    <div class="container checkout-result__inner">
      <div class="checkout-result__icon cancel" aria-hidden="true">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </div>
      <span class="bubble-tag">Checkout Cancelled</span>
      <h1 style="margin-top:18px;">Your order was not placed</h1>
      <p>
        No worries — your cart has been saved. You can return to it any time to
        complete your purchase, or continue browsing the shop.
      </p>
      <div class="checkout-result__actions">
        <a href="/shop/cart.html" class="btn-primary">Return to Cart →</a>
        <a href="/shop/" class="btn-secondary">Continue Shopping</a>
      </div>
    </div>
  </main>

  <script src="/assets/js/header.js" defer></script>
  <script src="/shop/assets/js/cart.js" defer></script>
</body>
</html>
