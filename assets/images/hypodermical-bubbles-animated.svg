<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 48" width="56" height="48" role="img" aria-label="Hypodermical bubbles mark">
  <g fill="none" stroke="currentColor" stroke-width="1.5">
    <circle cx="14" cy="24" r="9">
      <animate attributeName="r" values="9;8;9" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="32" cy="14" r="5">
      <animate attributeName="cy" values="14;12;14" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="40" cy="30" r="7">
      <animate attributeName="r" values="7;6.5;7" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="46" cy="14" r="3" fill="currentColor" stroke="none">
      <animate attributeName="cy" values="14;12;14" dur="2.6s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
